# Publication d'une version de Lynk Dev.
#
# Déclenchement :
#   - push d'un tag `vX.Y.Z`  → build + Release GitHub (draft)
#   - workflow_dispatch        → build manuel depuis l'onglet Actions
#
# Produit pour chaque OS les installeurs + les artefacts updater
# (`*.sig` + `latest.json`) grâce à `createUpdaterArtifacts: true` dans
# tauri.conf.json. `tauri-action` génère et attache `latest.json`, que
# l'endpoint updater de l'app pointe via la Release "latest".
#
# Secrets requis dans le repo (Settings → Secrets and variables → Actions) :
#   - TAURI_SIGNING_PRIVATE_KEY          : clé privée minisign (cf. tasks.md §2.1),
#                                          générée via `pnpm tauri signer generate`
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD : son mot de passe (vide si non protégée)
#
# La signature de CODE OS (Windows/macOS) n'est PAS configurée ici : on ship
# non-signé pour le lancement (cf. tasks.md §2.1faq). On l'ajoutera plus tard via
# des secrets supplémentaires sans toucher au reste du workflow.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # Requis pour que tauri-action puisse créer la Release et y attacher les
    # installeurs/`latest.json` (le GITHUB_TOKEN est read-only par défaut).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system deps (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install front deps
        run: pnpm install --frozen-lockfile

      - name: Build & release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des artefacts updater (minisign). Sans ces secrets,
          # `createUpdaterArtifacts` échoue — ils sont donc requis.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lynk Dev ${{ github.ref_name }}"
          releaseBody: "Voir le CHANGELOG. Installeurs ci-dessous — non signés au niveau OS, Windows et macOS afficheront donc un avertissement au premier lancement."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
