[package]
name = "lynk-dev"
version = "0.1.0"
description = "Lynk Dev — suite d'outils de developpement desktop (Git, Dev, DB)"
authors = ["moha528"]
edition = "2021"
license = "FSL-1.1-MIT"

[lib]
name = "lynk_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Auto-update. `process` permet le relaunch après installation.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }

# Hash du PIN (verrouillage applicatif). Argon2id, paramètres OWASP.
argon2 = "0.5"
# Fournit OsRng (génération du sel Argon2) — feature `getrandom` requise.
rand_core = { version = "0.6", features = ["getrandom"] }

# Utils
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native window styling (Mica/Acrylic) — Windows + macOS
window-vibrancy = "0.6"

# Sondes de santé HTTP du Dev Manager (et, plus tard, client OpenRouter).
# `rustls` plutôt qu'OpenSSL : pas de dépendance système à installer en CI.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Trousseau du système : Credential Manager (Windows), Keychain (macOS),
# Secret Service (Linux). La feature `v1` par défaut sélectionne le bon magasin
# par plateforme — ne pas la désactiver, le crate ne compile pas sans.
keyring = "4"

# Serveur MCP sur la boucle locale. `http1` suffit (un client sur 127.0.0.1),
# et on se passe de `query`/`form`/`ws` : le transport MCP est un POST JSON.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# Indispensable pour tuer un GROUPE de process (`kill(-pid)`). Sans ça, `mvnw`
# rend la main mais laisse `java` vivant, et le port reste occupé.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# Les tests d'intégration (`tests/`) ne voient **pas** les dépendances
# ordinaires du crate : il faut les redéclarer ici. `reqwest` sert de client
# HTTP à l'épreuve de bout en bout du serveur MCP.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
